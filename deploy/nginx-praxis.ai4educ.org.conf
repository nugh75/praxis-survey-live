# Vhost MANUALE per praxis.ai4educ.org (host nginx).
#
# NON gestito da cloudflared-manager / regenerateForwardAuthVhosts: questo host
# usa auth selettiva per-path, non whole-host. Tenerlo fuori dalla rigenerazione
# automatica (vedi access_matrix.json: "manualVhost": true).
#
# Topologia:
#   /            -> frontend SPA  (rispondenti, PUBBLICO)
#   /survey/*    -> frontend SPA  (PUBBLICO)
#   /api/        -> backend       (PUBBLICO: questionnaire + submit risposte)
#   /admin       -> frontend SPA  (PROTETTO: ai4auth gruppo admins)
#   /api/stats/* -> backend       (PROTETTO)
#   /ws/stats/*  -> backend       (PROTETTO, WebSocket)
#
# La protezione e' QUI (auth_request solo sulle location admin). I rispondenti
# anonimi non toccano mai ai4auth. Difesa in profondita': il backend ricontrolla
# l'header Remote-Groups (vedi backend/app/main.py).

upstream praxis_frontend { server 127.0.0.1:5173; }
upstream praxis_backend  { server 127.0.0.1:8002; }

server {
    listen 80;
    server_name praxis.ai4educ.org;

    # --- forward-auth ai4auth (chiamato solo dalle location protette) -------
    location = /internal/ai4auth/verify {
        internal;
        proxy_pass http://127.0.0.1:9091/api/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URL https://$http_host$request_uri;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie $http_cookie;
    }

    # --- API protette: statistiche dashboard --------------------------------
    location /api/stats/ {
        auth_request /internal/ai4auth/verify;
        error_page 401 =302 https://auth.ai4educ.org/login?rd=https://$http_host$request_uri;
        error_page 403 =302 https://portal.ai4educ.org;
        auth_request_set $a4_groups $upstream_http_remote_groups;
        auth_request_set $a4_user   $upstream_http_remote_user;
        auth_request_set $a4_email  $upstream_http_remote_email;
        auth_request_set $a4_name   $upstream_http_remote_name;
        # Segreto condiviso: il backend si fida degli header Remote-* SOLO se
        # questo combacia con FORWARD_AUTH_SHARED_SECRET. SOSTITUIRE.
        proxy_set_header X-Forwarded-Auth-Secret "SOSTITUIRE_CON_SEGRETO_LUNGO";
        proxy_set_header Remote-Groups $a4_groups;
        proxy_set_header Remote-User   $a4_user;
        proxy_set_header Remote-Email  $a4_email;
        proxy_set_header Remote-Name   $a4_name;
        proxy_pass http://praxis_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # --- WebSocket protetto: stream live dashboard --------------------------
    location /ws/stats/ {
        auth_request /internal/ai4auth/verify;
        error_page 401 =302 https://auth.ai4educ.org/login?rd=https://$http_host$request_uri;
        error_page 403 =302 https://portal.ai4educ.org;
        auth_request_set $a4_groups $upstream_http_remote_groups;
        auth_request_set $a4_user   $upstream_http_remote_user;
        proxy_set_header X-Forwarded-Auth-Secret "SOSTITUIRE_CON_SEGRETO_LUNGO";
        proxy_set_header Remote-Groups $a4_groups;
        proxy_set_header Remote-User   $a4_user;
        proxy_pass http://praxis_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # --- API pubbliche: questionario + invio risposte -----------------------
    location /api/ {
        proxy_pass http://praxis_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # --- SPA admin: pannello dashboard (PROTETTO) ---------------------------
    # Protegge la rotta /admin del frontend. La pagina serve comunque l'SPA;
    # i dati arrivano da /api/stats (gia' protetto). Doppio gate.
    location /admin {
        auth_request /internal/ai4auth/verify;
        error_page 401 =302 https://auth.ai4educ.org/login?rd=https://$http_host$request_uri;
        error_page 403 =302 https://portal.ai4educ.org;
        proxy_pass http://praxis_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # --- SPA pubblica: rispondenti (questionari) ----------------------------
    location / {
        proxy_pass http://praxis_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
